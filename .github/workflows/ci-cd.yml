name: Nofelet-chat pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod tidy
          go build ./...

      - name: Debug envconfig
        run: |
          go list -m github.com/sethvargo/go-envconfig
          go doc github.com/sethvargo/go-envconfig || true

      - name: Debug golangci config
        run: |
          pwd
          ls -la
          echo "===== .golangci.yml ====="
          cat .golangci.yml

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --config=.golangci.yml ./...
