run:
  tests: false
  modules-download-mode: mod
  go: '1.24'

# Полностью отключаем все линтеры, которые требуют анализа типов
linters:
  disable-all: true
  enable:
    - revive       # Стиль кода
    - staticcheck  # Поиск багов
    - unused       # Неиспользуемый код
    - govet        # Базовые ошибки
    - gosimple     # Упрощение кода

issues:
  # Этот блок игнорирует всё, что связано с ошибками сборки/типов
  exclude-rules:
    - linters:
        - typecheck
      text: ".*"